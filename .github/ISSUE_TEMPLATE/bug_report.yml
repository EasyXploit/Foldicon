name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security problems here; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Right-click a folder and choose Change icon
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Foldicon version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` to see it.
      placeholder: Windows 11 24H2 (26100.1234)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Installer from Releases
        - Microsoft Store
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
    validations:
      required: true
  - type: textarea
    id: folder
    attributes:
      label: About the folder
      description: Is it on a network drive, or kept by a sync client? Remove any personal path before you paste it.
