name: Translation
description: Offer to translate Foldicon, or report a wrong translation
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: French (fr)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For a wrong translation, say where the text shows and how it should read.
    validations:
      required: true
