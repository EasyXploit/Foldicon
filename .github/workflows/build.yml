# Builds the whole solution for each platform, including the C++ context menu, and runs the core unit tests on x64
name: build

on:
  push:
  pull_request:

# The jobs only read the code; no token can write to the repository
permissions:
  contents: read

jobs:
  build:
    # The image with Visual Studio 2026, whose toolset v145 the C++ projects use
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      # Official action only, pinned to the v4 tag's commit; Dependabot proposes the updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # MSBuild from the Visual Studio already on the runner, located without third-party actions
      - shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msbuild Foldicon.slnx -restore -p:Configuration=Release -p:Platform=${{ matrix.platform }} -nologo -v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # An x64 runner cannot run ARM64 tests
      - if: matrix.platform == 'x64'
        run: dotnet test tests/Foldicon.Core.Tests -c Release -p:Platform=x64 --no-build
      - if: matrix.platform == 'x64'
        run: tests/Foldicon.ContextMenu.Tests/bin/x64/Release/Foldicon.ContextMenu.Tests.exe
